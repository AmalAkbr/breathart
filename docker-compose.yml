services:
  app:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_FORMSPREE_ENDPOINT: ${VITE_FORMSPREE_ENDPOINT:-https://formspree.io/f/myyagyqg}
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
    container_name: brt_app
    env_file:
      - backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "8080:8080"
    restart: unless-stopped
